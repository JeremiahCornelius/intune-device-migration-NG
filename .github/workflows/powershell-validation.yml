name: PowerShell Validation

on:
  push:
    branches:
      - main
    paths:
      - 'Migration.Common.ps1'
      - 'preflight.ps1'
      - 'install.ps1'
      - 'startMigrate.ps1'
      - 'reboot.ps1'
      - 'postMigrate.ps1'
      - 'postMigrateUser.ps1'
      - 'groupTag.ps1'
      - 'validation/**'
      - 'lab/**'
      - '.github/PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/powershell-validation.yml'
  pull_request:
    paths:
      - 'Migration.Common.ps1'
      - 'preflight.ps1'
      - 'install.ps1'
      - 'startMigrate.ps1'
      - 'reboot.ps1'
      - 'postMigrate.ps1'
      - 'postMigrateUser.ps1'
      - 'groupTag.ps1'
      - 'validation/**'
      - 'lab/**'
      - '.github/PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/powershell-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PSSCRIPTANALYZER_VERSION: '1.25.0'

jobs:
  windows-powershell-parser:
    name: Windows PowerShell 5.1 parser
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1, pinned by full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Parse migration scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $scriptFiles = @(
              'Migration.Common.ps1'
              'preflight.ps1'
              'install.ps1'
              'startMigrate.ps1'
              'reboot.ps1'
              'postMigrate.ps1'
              'postMigrateUser.ps1'
              'groupTag.ps1'
              'validation/Invoke-MigrationValidation.ps1'
              'lab/Build-NGLabExecutionBundle.ps1'
              'lab/Test-NGLabExecutionBundle.ps1'
          )

          function ConvertTo-GitHubCommandValue {
              param(
                  [Parameter(Mandatory)]
                  [string]$Value
              )

              return $Value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          }

          $failed = $false

          Write-Host "Parser runtime: $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSEdition -ne 'Desktop' -or $PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.1, observed $($PSVersionTable.PSEdition) $($PSVersionTable.PSVersion)."
          }

          foreach ($relativePath in $scriptFiles) {
              $fullPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath $relativePath

              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  $message = ConvertTo-GitHubCommandValue -Value "Required validation target is missing: $relativePath"
                  Write-Host "::error file=$relativePath::$message"
                  $failed = $true
                  continue
              }

              $tokens = $null
              $parseErrors = $null

              [System.Management.Automation.Language.Parser]::ParseFile(
                  $fullPath,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null

              if (@($parseErrors).Count -eq 0) {
                  Write-Host "[PASS] $relativePath"
                  continue
              }

              $failed = $true

              foreach ($parseError in @($parseErrors)) {
                  $line = [Math]::Max(1, [int]$parseError.Extent.StartLineNumber)
                  $column = [Math]::Max(1, [int]$parseError.Extent.StartColumnNumber)
                  $message = ConvertTo-GitHubCommandValue -Value $parseError.Message

                  Write-Host "::error file=$relativePath,line=$line,col=$column::$message"
              }
          }

          if ($failed) {
              throw 'One or more migration scripts failed Windows PowerShell 5.1 parser validation.'
          }

          Write-Host 'All migration scripts passed Windows PowerShell 5.1 parser validation.'

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1, pinned by full commit SHA.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install pinned PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $requiredVersion = [version]$env:PSSCRIPTANALYZER_VERSION

          $gallery = Get-PSRepository -Name 'PSGallery' -ErrorAction SilentlyContinue
          if (-not $gallery) {
              Register-PSRepository -Default -ErrorAction Stop
          }

          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted -ErrorAction Stop

          Install-Module `
              -Name 'PSScriptAnalyzer' `
              -RequiredVersion $requiredVersion `
              -Repository 'PSGallery' `
              -Scope CurrentUser `
              -Force `
              -AllowClobber `
              -ErrorAction Stop

          Import-Module `
              -Name 'PSScriptAnalyzer' `
              -RequiredVersion $requiredVersion `
              -Force `
              -ErrorAction Stop

          $loaded = Get-Module -Name 'PSScriptAnalyzer'
          if (-not $loaded -or $loaded.Version -ne $requiredVersion) {
              throw "Expected PSScriptAnalyzer $requiredVersion, observed '$($loaded.Version)'."
          }

          Write-Host "PSScriptAnalyzer version: $($loaded.Version)"

      - name: Run static analysis
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          Import-Module `
              -Name 'PSScriptAnalyzer' `
              -RequiredVersion ([version]$env:PSSCRIPTANALYZER_VERSION) `
              -Force `
              -ErrorAction Stop

          $scriptFiles = @(
              'Migration.Common.ps1'
              'preflight.ps1'
              'install.ps1'
              'startMigrate.ps1'
              'reboot.ps1'
              'postMigrate.ps1'
              'postMigrateUser.ps1'
              'groupTag.ps1'
              'validation/Invoke-MigrationValidation.ps1'
              'lab/Build-NGLabExecutionBundle.ps1'
              'lab/Test-NGLabExecutionBundle.ps1'
          )

          $settingsPath = Join-Path `
              -Path $env:GITHUB_WORKSPACE `
              -ChildPath '.github/PSScriptAnalyzerSettings.psd1'

          if (-not (Test-Path -LiteralPath $settingsPath -PathType Leaf)) {
              throw "PSScriptAnalyzer settings file is missing: $settingsPath"
          }

          function ConvertTo-GitHubCommandValue {
              param(
                  [Parameter(Mandatory)]
                  [string]$Value
              )

              return $Value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          }

          $records = [System.Collections.Generic.List[object]]::new()

          foreach ($relativePath in $scriptFiles) {
              $fullPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath $relativePath

              if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
                  throw "Required validation target is missing: $relativePath"
              }

              $findings = @(
                  Invoke-ScriptAnalyzer `
                      -Path $fullPath `
                      -Settings $settingsPath
              )

              foreach ($finding in $findings) {
                  $records.Add(
                      [pscustomobject]@{
                          File = $relativePath
                          Finding = $finding
                      }
                  )
              }
          }

          foreach ($record in $records) {
              $finding = $record.Finding
              $severity = [string]$finding.Severity
              $line = [Math]::Max(1, [int]$finding.Line)
              $column = [Math]::Max(1, [int]$finding.Column)
              $ruleName = [string]$finding.RuleName
              $message = ConvertTo-GitHubCommandValue -Value "[$ruleName] $($finding.Message)"

              if ($severity -eq 'Error') {
                  Write-Host "::error file=$($record.File),line=$line,col=$column::$message"
              }
              else {
                  Write-Host "::warning file=$($record.File),line=$line,col=$column::$message"
              }
          }

          $errorCount = @(
              $records |
                  Where-Object { [string]$_.Finding.Severity -eq 'Error' }
          ).Count

          $warningCount = @(
              $records |
                  Where-Object { [string]$_.Finding.Severity -eq 'Warning' }
          ).Count

          $compatibilityFindings = @(
              $records |
                  Where-Object { [string]$_.Finding.RuleName -eq 'PSUseCompatibleSyntax' }
          )

          @(
              '# PowerShell static-analysis summary'
              ''
              "| Metric | Count |"
              "| --- | ---: |"
              "| Analyzer errors | $errorCount |"
              "| Analyzer warnings | $warningCount |"
              "| PowerShell 5.1 syntax-compatibility findings | $($compatibilityFindings.Count) |"
              ''
              "PSScriptAnalyzer version: ``$env:PSSCRIPTANALYZER_VERSION``"
              ''
              'Policy: analyzer **Errors** and `PSUseCompatibleSyntax` findings are blocking. Other warnings are annotated but remain non-blocking while inherited scripts are progressively hardened.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

          $blocking = @(
              $records |
                  Where-Object {
                      ([string]$_.Finding.Severity -eq 'Error') -or
                      ([string]$_.Finding.RuleName -eq 'PSUseCompatibleSyntax')
                  }
          )

          if ($blocking.Count -gt 0) {
              throw "PSScriptAnalyzer found $($blocking.Count) blocking issue(s)."
          }

          Write-Host "Static analysis completed: $errorCount error(s), $warningCount warning(s), 0 blocking compatibility findings."
